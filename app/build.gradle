plugins { id 'com.android.application' }

def hasSigning = System.getenv('KEYSTORE_FILE') != null

android {
    namespace 'br.com.missaopmpe.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.missaopmpe.app'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile file(System.getenv('KEYSTORE_FILE'))
                storePassword System.getenv('STORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
    }
}
