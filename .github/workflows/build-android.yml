name: Gerar APK e AAB

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar aplicativo
        run: gradle --no-daemon assembleDebug bundleRelease
      - name: Organizar arquivos
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/Missao-PMPE.apk
          cp app/build/outputs/bundle/release/app-release.aab release/Missao-PMPE-sem-assinatura.aab
          cd release && sha256sum Missao-PMPE.apk Missao-PMPE-sem-assinatura.aab > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Missao-PMPE-Android
          path: release/
          retention-days: 90
