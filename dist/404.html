<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Página não encontrada (404) — Jornada do Caçador</title>
  <meta name="description" content="O portal solicitado não foi encontrado. Volte para a central da Jornada do Caçador.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#123154 0,#07111f 45%,#050a12 100%);color:#edf6ff;font:16px/1.55 Inter,system-ui,sans-serif;padding:20px;text-align:center}
    .box{max-width:480px;background:#0b1624;border:1px solid #2c5774;border-radius:22px;padding:28px 24px;box-shadow:0 24px 70px rgba(0,0,0,.55)}
    .badge{display:inline-block;padding:4px 10px;border-radius:99px;background:#12304a;color:#59e6ff;font-size:.72rem;font-weight:800;letter-spacing:.12em}
    h1{margin:12px 0 8px;font-size:1.65rem}
    p{color:#a8bdd1;margin:0 0 20px}
    a.btn{display:inline-block;text-decoration:none;background:linear-gradient(90deg,#127de8,#25b7e8);color:#fff;font-weight:800;padding:12px 22px;border-radius:12px}
  </style>
</head>
<body>
  <main class="box">
    <span class="badge">ERRO 404 · PORTAL INEXISTENTE</span>
    <h1>Rota fora do Mapa do Edital</h1>
    <p>O endereço que você tentou acessar não existe ou foi movido. Retorne à base principal para continuar suas missões.</p>
    <a class="btn" href="./">Voltar para a Jornada do Caçador</a>
  </main>
</body>
</html>
